name: Chifbay Instagram — find my account id (setup)

# Run this ONCE, after adding the IG_ACCESS_TOKEN secret.
#
# It prints the Facebook Pages the token can see and, for each, the Instagram
# Business Account id. That id is what goes into ig_user_id in config.json — it
# is NOT the number in your profile URL, and Meta's own screens bury it.
#
# Runs here rather than on your machine so the token only ever exists as a
# GitHub secret. It is never printed: only the account id is.
on:
  workflow_dispatch:
    inputs:
      probe:
        description: "yes = also upload a hidden test photo and remove it again"
        default: "no"

permissions:
  contents: read

# Actions defaults to "bash -e", which has no pipefail — a piped step would
# then take the exit code of the last command in the pipe and hide a failure.
# Named "bash" it becomes "bash --noprofile --norc -eo pipefail".
defaults:
  run:
    shell: bash

jobs:
  whoami:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Which account can this token post to?
        working-directory: ig-auto
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: node bin/whoami.mjs

      - name: What is this token allowed to do? (names only)
        working-directory: ig-auto
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: "17841473755961444"   # the public id from config.json
          PROBE_IMAGE: ${{ github.event.inputs.probe == 'yes' && 'https://www.chifbay.com/ig/20261002204317-ec30-1.jpg' || '' }}
          PAGE_LIST: "1"
          PAGE_FIELDS: "1"
        run: node bin/meta-scopes.mjs

      # The booking Worker answers comments on Instagram, Facebook and Threads (booking-api/replies.js). A workflow
      # cannot hand a secret to Cloudflare directly, so it gives the Meta token to the Worker here (IG_SYNC_SECRET),
      # every run: a renewed token reaches the Worker the same day. Never printed.
      - name: Share the Meta token with the reply robot
        if: always()
        continue-on-error: true
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_SYNC_SECRET: ${{ secrets.IG_SYNC_SECRET }}
        run: |
          code=$(node -e 'process.stdout.write(JSON.stringify({token: process.env.IG_ACCESS_TOKEN}))' | curl -s -o /dev/null -w '%{http_code}' -X PUT \
            -H "Authorization: Bearer $IG_SYNC_SECRET" -H "Content-Type: application/json" --data-binary @- \
            https://chifbay-booking-api.chifandcopt.workers.dev/v1/replies/meta-token)
          echo "Worker answered $code"
          [ "$code" = "200" ]

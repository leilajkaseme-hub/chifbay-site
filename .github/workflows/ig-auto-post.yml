name: Chifbay Instagram — daily post

# The job that must not fail. It takes the oldest item off the feed queue and
# posts it straight to Meta's API — no third party, no monthly operation budget.
#
# The story counterpart is ig-auto-story.yml, with its own queue and guard.
#
# Deliberately minimal: no npm install, no AI provider, no third-party package
# of any kind. bin/post.mjs uses nothing but Node's own standard library, so
# the only things that can break a post are GitHub being down or Instagram
# refusing it — and both of those alert.
#
# 10:00 UTC, then the script waits a random 0-90 minutes before publishing, so
# the account is not posting at the same second every day.
#
# 15:00 UTC is the catch-up. bin/post.mjs refuses to post twice in one day, so
# on a normal day the second run prints "already posted today" and stops. It
# only does anything when the morning run failed — which turns a bad half hour
# at Meta into a late post instead of a missing day.
on:
  schedule:
    - cron: "0 10 * * *"
    - cron: "0 15 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: ig-auto
  cancel-in-progress: false

# GitHub's default shell is "bash -e", which has no pipefail: in "node post.mjs
# | tee log" the step takes tee's exit code, so a post that never went out
# still finished green and the if: failure() alert never fired. That is exactly
# how this ran broken for a day with every run showing a tick. Naming the shell
# "bash" makes Actions use "bash --noprofile --norc -eo pipefail", for every
# step here and every step added later.
defaults:
  run:
    shell: bash

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 150   # covers the jitter wait plus retries
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Post to Instagram
        id: post
        working-directory: ig-auto
        env:
          # A manual run is a human watching a log, so it posts straight away.
          # The catch-up run skips the drift too — it is already late.
          # The normal 10:00 run keeps the random 0-90 minute drift.
          IG_NO_JITTER: >-
            ${{ (github.event_name == 'workflow_dispatch'
                 || github.event.schedule == '0 15 * * *') && '1' || '0' }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          # Only used if config.json is switched back to the "make-webhook" transport.
          MAKE_IG_WEBHOOK: ${{ secrets.MAKE_IG_WEBHOOK }}
        run: |
          node bin/post.mjs | tee /tmp/post.log
          echo "posted=$(grep -o 'POSTED=.*' /tmp/post.log | cut -d= -f2)" >> "$GITHUB_OUTPUT"

      # Runs even if publishing failed, so a failure is recorded in the ledger
      # rather than lost with the runner.
      # Same reason as the top-up job: ledger.jsonl and state.json do not exist
      # until the first post, and `git add` on a missing path is a hard error.
      - name: Commit & push the record
        if: always()
        run: |
          git add ig-auto
          if git diff --staged --quiet; then
            echo "nothing to record"
            exit 0
          fi
          git commit -m "Instagram: posted $(date -u +%Y-%m-%d)"
          git pull --rebase origin main || true
          git push

      - name: Notify failure (ntfy)
        if: failure()
        run: |
          curl -s --max-time 20 \
            -H "Title: CHIFBAY Instagram post FAILED" \
            -H "Priority: high" -H "Tags: rotating_light,boat" \
            -d "Today's Instagram post did not go out. The item is still in the queue and tomorrow's run will retry it. Log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            https://ntfy.sh/futurx-blog-alerts-544024878e || true

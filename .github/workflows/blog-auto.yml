name: Chifbay Journal — publish today's post (from the queue)

# One Journal post every day, no exception (Theo, 9 Oct 2026).
#
# Posts are written days ahead by journal-fill.yml into journal-queue/, and the Mac mini adds
# their ChatGPT photos. This job only moves the next finished post into place: no AI, so a
# Claude limit can no longer cost a day (it cost 22-23 Sep and 5-7 Oct). Read scripts/journal/lib.mjs.
#
# It runs five times a day. The first run that finds no post dated today publishes one; the
# others see "ALREADY" and stop. GitHub's cron drifts by hours, so one daily run was not enough.
# Last resort, queue empty: write one post now with Claude, then publish it.
on:
  schedule:
    - cron: "10 5 * * *"
    - cron: "10 9 * * *"
    - cron: "10 13 * * *"
    - cron: "10 17 * * *"
    - cron: "40 20 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write      # lets the self-heal step request a fresh Pages build
  actions: write    # starts gbp-draft.yml once the new post is live

concurrency:
  group: journal-publish
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Publish the next queued post
        id: pub
        run: |
          out=$(node scripts/journal/publish.mjs)
          echo "$out"
          echo "state=$(echo "$out" | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      # Last resort only: the queue is empty, so a post is written now.
      - name: Queue empty, write one post now
        if: steps.pub.outputs.state == 'EMPTY'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          npm install -g @anthropic-ai/claude-code
          node scripts/journal/fill.mjs --today --max 1 --target 1
          out=$(node scripts/journal/publish.mjs)
          echo "$out"
          case "$out" in PUBLISHED*) ;; *) echo "::error::no post today: the queue is empty and none could be written"; exit 1;; esac

      - name: Check every article image really exists
        if: steps.pub.outputs.state != 'ALREADY'
        id: imgcheck
        continue-on-error: true
        run: node scripts/checks/verify-post-images.mjs

      - name: Warn about a missing article image (ntfy)
        if: steps.imgcheck.outcome == 'failure'
        run: |
          curl -s --max-time 20 \
            -H "Title: CHIFBAY journal: a post image is missing" \
            -H "Priority: default" -H "Tags: frame_photo,boat" \
            -d "A published article points at an image that does not exist. Run: node scripts/checks/verify-post-images.mjs" \
            https://ntfy.sh/futurx-blog-alerts-544024878e || true

      # WebP copies of the new post's photos (scripts/make-webp.py), and the
      # pages pointed at them. Best effort: without it the post keeps its JPEGs.
      - name: WebP copies of the new photos
        if: steps.pub.outputs.state != 'ALREADY'
        continue-on-error: true
        run: |
          python3 -m pip install --quiet --user --break-system-packages pillow || python3 -m pip install --quiet --user pillow
          python3 scripts/make-webp.py
          node scripts/use-webp.mjs

      # the Journal pages carry their cards in the HTML: add today's post
      - name: Rebuild the Journal card lists
        if: steps.pub.outputs.state != 'ALREADY'
        run: node scripts/build-blog-index.mjs

      # links to an article must use its canonical URL (no ".html")
      - name: Point article links at their canonical URL
        if: steps.pub.outputs.state != 'ALREADY'
        run: node scripts/fix-post-links.mjs

      # contextual links from the new article to the pages that sell
      # (Cabo Girão, Fajã dos Padres, sunset, day trip, home): safe to run again
      - name: Link the article to the trip pages
        if: steps.pub.outputs.state != 'ALREADY'
        run: node scripts/add-money-links.mjs --write

      # the Marina layer (type, colours, Motion) and the Google preferred-source link
      # on the new article: both safe to run again
      - name: Marina design layer on the new article
        if: steps.pub.outputs.state != 'ALREADY'
        run: |
          node scripts/add-marina.mjs --write
          node scripts/add-preferred-source.mjs --write

      - name: Commit & push
        if: steps.pub.outputs.state != 'ALREADY'
        run: |
          TITLE=$(python3 -c "import json; print(json.load(open('posts/posts.json'))[0]['title'])")
          git add -A
          git commit -m "New Journal post: $TITLE"
          scripts/ci-push.sh

      # GitHub Pages deploys can fail transiently ("Deployment failed, try again
      # later") — when that happens the post is committed but never goes live.
      # This step waits for the new post to appear on chifbay.com and, if it
      # doesn't, requests fresh Pages builds until it does.
      - name: Verify post is live (self-heal Pages deploy)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git pull --rebase origin main || true
          SLUG=$(python3 -c "import json; print(json.load(open('posts/posts.json'))[0]['slug'])")
          echo "Waiting for slug '$SLUG' to appear on the live site…"
          live_ok() {
            curl -sf --max-time 20 "https://chifbay.com/posts/posts.json?nocache=$(date +%s)" | grep -q "\"$SLUG\"" &&
            curl -sf -o /dev/null --max-time 20 "https://chifbay.com/posts/$SLUG?nocache=$(date +%s)"
          }
          for attempt in 1 2 3 4; do
            for i in $(seq 1 12); do
              if live_ok; then echo "OK: post is live (attempt $attempt)"; exit 0; fi
              sleep 20
            done
            echo "Still not live — requesting a fresh Pages build (attempt $attempt)"
            gh api -X POST "repos/${GITHUB_REPOSITORY}/pages/builds" || true
          done
          echo "::error::Post is still not live after 4 heal attempts — check GitHub Pages status"
          exit 1

      # Google Business Profile draft of the new article, once a day (only the run that published).
      - name: Start the Google Business Profile draft
        if: steps.pub.outputs.state != 'ALREADY'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run gbp-draft.yml --repo "${GITHUB_REPOSITORY}"

      # Push notification to the ntfy app if anything above failed.
      - name: Notify failure (ntfy)
        if: failure()
        run: |
          curl -s --max-time 20 \
            -H "Title: CHIFBAY blog post FAILED" \
            -H "Priority: high" -H "Tags: rotating_light,boat" \
            -d "Today's Chifbay Journal post failed (the next run of the day tries again). Log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            https://ntfy.sh/futurx-blog-alerts-544024878e || true

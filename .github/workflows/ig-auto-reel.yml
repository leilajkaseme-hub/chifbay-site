name: Chifbay Instagram — Reel reminder

# Reels are posted by Theo from his phone (a trending song cannot be added by
# code). On the day he approved on the portal, this sends the video and the
# caption to his phone at 17:30 Madeira summer time, and again every day until
# he marks it posted. Read only: it never posts and never pushes.
on:
  schedule:
    - cron: "30 16 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Send due Reels to the phone
        working-directory: ig-auto
        run: node bin/reel-due.mjs

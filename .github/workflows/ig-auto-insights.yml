name: Chifbay Instagram — insights

# Reads how the account is doing (reach, followers, every post's numbers) and
# keeps the result as a run artifact. Read only: it never posts and never pushes.
# Download: gh run download <run id> -R leilajkaseme-hub/chifbay-site -n ig-insights
on:
  workflow_dispatch: {}
  schedule:
    - cron: "15 6 * * *"   # daily, so the trend exists before anyone asks for it

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  read:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Read the insights
        working-directory: ig-auto
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: node bin/insights.mjs > insights.json

      # The portal's Instagram page shows these numbers. Only the Worker and
      # this repo know IG_SYNC_SECRET; without it the Worker answers 404.
      - name: Send them to the portal
        env:
          IG_SYNC_SECRET: ${{ secrets.IG_SYNC_SECRET }}
        run: |
          curl -sf --max-time 60 -X POST \
            -H "Authorization: Bearer $IG_SYNC_SECRET" -H "Content-Type: application/json" \
            --data-binary @ig-auto/insights.json \
            https://chifbay-booking-api.chifandcopt.workers.dev/v1/ig/insights

      - name: Freeze 24 h and 7 day readings
        working-directory: ig-auto
        run: node bin/measures.mjs insights.json

      - name: Commit the readings
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ig-auto/measures.json
          if git diff --staged --quiet; then echo "no new reading"; exit 0; fi
          git commit -m "Instagram: 24 h and 7 day readings $(date -u +%Y-%m-%d)"
          scripts/ci-push.sh

      - name: Keep the result
        uses: actions/upload-artifact@v4
        with:
          name: ig-insights
          path: ig-auto/insights.json
          retention-days: 90

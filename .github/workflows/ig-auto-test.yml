name: Chifbay Instagram — tests

# The two faults that stopped this account posting were both invisible: one was
# a race with Meta's own image download, the other made a failed post finish
# green. Neither showed up in a review and neither showed up in the Actions tab.
#
# So they are a test, and the test runs on every change to the posting code or
# to the workflows that carry it. A red tick here is cheap. A silent feed is not.
on:
  push:
    paths:
      - "ig-auto/**"
      - ".github/workflows/ig-auto-*.yml"
  pull_request:
    paths:
      - "ig-auto/**"
      - ".github/workflows/ig-auto-*.yml"
  workflow_dispatch: {}

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # No npm install for this one, on purpose: it uses a fake Meta and Node's
      # own assert, so nothing here can break because a package changed. It runs
      # first for the same reason.
      - name: Publishing rules still hold
        working-directory: ig-auto
        run: node test-publish.mjs

      # This one does need the packages: it asks the real libraryFiles() what it
      # would serve, and that pulls in sharp. Kept as its own step so a package
      # problem can never be mistaken for a publishing fault.
      - name: Install
        working-directory: ig-auto
        run: npm ci --no-audit --no-fund

      # Which photos are allowed out. Guards the four faults that were live on
      # the account: flat lays going out four days running, one of them twice,
      # stories serving 9:16 crops of feed photos, and a photo removed from the
      # Drive PUBLISH folder still posting because the sync only ever added.
      - name: Photo rules still hold
        working-directory: ig-auto
        run: node test-library.mjs

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>TikTok posting | Chifbay</title>
<meta name="robots" content="noindex,nofollow"/>
<link rel="icon" href="assets/favicon.ico" sizes="any"/>
<!--
  Chifbay's internal TikTok posting tool.

  This is the interface behind our daily posting: we connect our own TikTok
  account once, then send our own trip photos to it. It is deliberately small
  and it is not linked from the public site (noindex, no nav).

  Nothing secret is here. The client secret and the access token live in a
  Cloudflare Worker; this page only ever sees "connected: yes/no", the account
  name, and the result of a post.
-->
<style>
  :root{ color-scheme: dark; --bg:#0b1015; --card:#121a22; --line:#22303d; --ink:#e8eef4; --dim:#93a5b6; --gold:#e2c288; --ok:#5ad1a5; --bad:#ff9d9d; }
  *{ box-sizing:border-box }
  body{ margin:0; background:var(--bg); color:var(--ink); padding:28px 20px 60px;
        font:400 16px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif }
  .wrap{ max-width:760px; margin:0 auto }
  header{ display:flex; align-items:center; gap:14px; margin-bottom:26px }
  header img{ height:44px; width:44px; border-radius:10px }
  h1{ font-size:1.35rem; margin:0; font-weight:600; letter-spacing:-.01em }
  header small{ display:block; color:var(--dim); font-size:.85rem; font-weight:400 }
  .card{ background:var(--card); border:1px solid var(--line); border-radius:14px; padding:22px; margin-bottom:18px }
  .card h2{ font-size:.78rem; text-transform:uppercase; letter-spacing:.14em; color:var(--dim);
            margin:0 0 14px; font-weight:600 }
  button{ background:#2d7ff9; color:#fff; border:0; border-radius:9px; padding:11px 18px;
          font:500 .95rem ui-sans-serif,system-ui,sans-serif; cursor:pointer }
  button:hover{ background:#1b6ae8 }
  button:disabled{ opacity:.45; cursor:not-allowed }
  button.ghost{ background:transparent; border:1px solid var(--line); color:var(--ink) }
  button.ghost:hover{ background:#1a242e }
  .row{ display:flex; gap:10px; flex-wrap:wrap; align-items:center }
  .pill{ display:inline-flex; align-items:center; gap:8px; font-size:.9rem; color:var(--dim) }
  .dot{ width:9px; height:9px; border-radius:50%; background:#5a6b7c }
  .dot.on{ background:var(--ok) } .dot.off{ background:var(--bad) }
  input,textarea{ width:100%; background:#0b1015; border:1px solid var(--line); border-radius:9px;
                  color:var(--ink); padding:11px 13px; font:400 .95rem/1.5 ui-sans-serif,system-ui,sans-serif }
  textarea{ min-height:92px; resize:vertical }
  label{ display:block; font-size:.85rem; color:var(--dim); margin:14px 0 6px }
  .shots{ display:grid; grid-template-columns:repeat(auto-fill,minmax(96px,1fr)); gap:10px; margin-top:6px }
  .shots button{ padding:0; background:none; border:2px solid transparent; border-radius:9px; overflow:hidden; line-height:0 }
  .shots button.sel{ border-color:var(--gold) }
  .shots img{ width:100%; aspect-ratio:4/5; object-fit:cover; display:block }
  pre{ background:#0b1015; border:1px solid var(--line); border-radius:9px; padding:13px;
       font:400 .8rem/1.5 ui-monospace,SFMono-Regular,Menlo,monospace; color:var(--ok);
       white-space:pre-wrap; word-break:break-all; margin:14px 0 0 }
  pre.bad{ color:var(--bad) }
  .note{ color:var(--dim); font-size:.85rem; margin:10px 0 0 }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <img src="assets/favicon.png" alt="Chifbay"/>
    <div><h1>TikTok posting</h1><small>Chifbay — Funchal, Madeira</small></div>
  </header>

  <div class="card">
    <h2>Account</h2>
    <div class="row" style="justify-content:space-between">
      <span class="pill"><span class="dot" id="dot"></span><span id="who">Enter the admin key</span></span>
      <div class="row">
        <button id="connect">Connect TikTok</button>
        <button id="refresh" class="ghost">Refresh</button>
      </div>
    </div>
    <label for="adminkey">Admin key</label>
    <input id="adminkey" type="password" autocomplete="off" spellcheck="false" placeholder="••••••"/>
    <p class="note" id="scopes"></p>
  </div>

  <div class="card">
    <h2>Choose a photo</h2>
    <div class="shots" id="shots"></div>
    <label for="url">Image URL</label>
    <input id="url" type="text" spellcheck="false"/>
    <label for="caption">Caption</label>
    <textarea id="caption">A quiet morning off the south coast of Madeira. Private boat from Funchal, skipper included, five guests maximum.</textarea>
  </div>

  <div class="card">
    <h2>Post</h2>
    <div class="row">
      <button id="draft" class="ghost">Send to TikTok drafts</button>
      <button id="post">Post now</button>
    </div>
    <p class="note">“Send to drafts” puts it in the TikTok inbox to finish by hand. “Post now” publishes straight to the profile.</p>
    <pre id="out" hidden></pre>
  </div>
</div>

<script>
(function () {
  var API = "https://chifbay-tiktok.chifandcopt.workers.dev";
  var SHOTS = [
    "https://chifbay.com/ig/20260811031827-4418.jpg",
    "https://chifbay.com/ig/20260811031840-53bd.jpg",
    "https://chifbay.com/ig/20260811031853-708b.jpg",
    "https://chifbay.com/ig/20260811031913-7f84.jpg"
  ];

  var $ = function (id) { return document.getElementById(id); };
  var out = $("out");

  // An inline field rather than a prompt(): a native modal blocks the page,
  // and it looks like a broken tool rather than a product. Kept in
  // sessionStorage so it survives the round trip to TikTok and back, and is
  // gone when the tab closes. It never goes in the URL.
  function key() {
    return sessionStorage.getItem("cb-tt-key") || "";
  }
  var keyBox = $("adminkey");
  keyBox.value = key();
  keyBox.addEventListener("input", function () {
    sessionStorage.setItem("cb-tt-key", keyBox.value.trim());
  });
  keyBox.addEventListener("change", status);

  function show(msg, bad) {
    out.hidden = false;
    out.className = bad ? "bad" : "";
    out.textContent = typeof msg === "string" ? msg : JSON.stringify(msg, null, 2);
  }

  function call(path, opts) {
    opts = opts || {};
    opts.headers = Object.assign({ "X-Admin-Key": key() }, opts.headers || {});
    return fetch(API + path, opts).then(function (r) {
      return r.json().then(function (j) {
        if (!r.ok || j.error) throw new Error(j.error || ("HTTP " + r.status));
        return j;
      });
    });
  }

  // --- photo picker ---------------------------------------------------------
  SHOTS.forEach(function (src, i) {
    var b = document.createElement("button");
    var img = document.createElement("img");
    img.src = src; img.alt = "Chifbay photo " + (i + 1); img.loading = "lazy";
    b.appendChild(img);
    b.onclick = function () {
      [].forEach.call($("shots").children, function (c) { c.className = ""; });
      b.className = "sel";
      $("url").value = src;
    };
    $("shots").appendChild(b);
    if (i === 0) b.onclick();
  });

  // --- account --------------------------------------------------------------
  function status() {
    if (!key()) {
      $("dot").className = "dot";
      $("who").textContent = "Enter the admin key";
      return;
    }
    $("who").textContent = "Checking…";
    call("/status").then(function (s) {
      if (s.connected) {
        $("dot").className = "dot on";
        $("who").textContent = "Connected" + (s.display_name ? " as " + s.display_name : "");
        $("scopes").textContent = "Permissions: " + (s.scope || "—") +
          " · token renews automatically (last " + (s.refreshed_at || "—") + ")";
        $("connect").textContent = "Reconnect";
      } else {
        $("dot").className = "dot off";
        $("who").textContent = "Not connected";
        $("scopes").textContent = "";
      }
    }).catch(function (e) {
      $("dot").className = "dot off";
      $("who").textContent = "Not connected";
      show(e.message, true);
    });
  }

  $("connect").onclick = function () {
    call("/connect-url").then(function (r) { location.href = r.url; })
      .catch(function (e) { show(e.message, true); });
  };
  $("refresh").onclick = status;

  // --- posting --------------------------------------------------------------
  function send(draft) {
    var body = {
      image_url: $("url").value.trim(),
      caption: $("caption").value.trim(),
      title: "Chifbay — Madeira",
      draft: draft
    };
    if (!body.image_url) return show("Pick a photo first.", true);
    show(draft ? "Sending to TikTok drafts…" : "Posting to TikTok…");
    $("draft").disabled = $("post").disabled = true;

    call("/post", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body)
    }).then(function (r) {
      show(r);
      if (r.publish_id) poll(r.publish_id);
    }).catch(function (e) {
      show(e.message, true);
    }).then(function () {
      $("draft").disabled = $("post").disabled = false;
    });
  }

  // TikTok processes the photo after accepting it, so the useful answer only
  // arrives a few seconds later.
  function poll(id, n) {
    n = n || 0;
    if (n > 10) return;
    setTimeout(function () {
      call("/publish-status?publish_id=" + encodeURIComponent(id))
        .then(function (s) {
          show({ publish_id: id, status: s.status, fail_reason: s.fail_reason || null });
          if (s.status && s.status !== "PUBLISH_COMPLETE" && s.status !== "FAILED") poll(id, n + 1);
        })
        .catch(function () { /* keep the accepted result on screen */ });
    }, 3000);
  }

  $("draft").onclick = function () { send(true); };
  $("post").onclick = function () { send(false); };

  // Coming back from the TikTok authorization screen.
  var q = new URLSearchParams(location.search);
  if (q.get("connected")) show("TikTok connected.");
  if (q.get("error")) show("TikTok returned: " + q.get("error"), true);

  status();
})();
</script>
</body>
</html>

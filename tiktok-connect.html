<!DOCTYPE html>
<html lang="en">
<head>
<script>/*theme*/(function(){try{var t=localStorage.getItem('cb-theme');if(t!=='light'&&t!=='dark')t='dark';document.documentElement.setAttribute('data-theme',t)}catch(e){document.documentElement.setAttribute('data-theme','dark')}})();</script>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Connect TikTok | Chifbay</title>
<meta name="robots" content="noindex,nofollow"/>
<link rel="icon" href="assets/favicon.ico" sizes="any"/>
<!--
  OAuth landing page for the Chifbay TikTok app.

  TikTok sends the browser back here with a one-time authorization code. This
  page hands that code straight to our Cloudflare Worker, which is the only
  place holding the client secret needed to exchange it for a token. The code is
  single-use, expires in minutes, and is never stored in this page.

  Deliberately plain: no tracking, no third-party scripts, noindex.
-->
<style>
  :root{ color-scheme: dark }
  body{ margin:0; min-height:100vh; display:grid; place-items:center; background:#0b1015;
        color:#e8eef4; padding:24px;
        font:400 16px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif }
  .card{ width:100%; max-width:520px; background:#121a22; border:1px solid #1f2b36;
         border-radius:14px; padding:32px; text-align:center }
  img{ width:56px; height:56px; border-radius:12px; margin-bottom:18px }
  h1{ margin:0 0 8px; font-size:1.25rem; font-weight:600 }
  p{ margin:0 0 20px; color:#9fb0c0; font-size:.95rem }
  a.btn{ display:inline-block; background:#2d7ff9; color:#fff; text-decoration:none;
         border-radius:9px; padding:11px 20px; font-weight:500; font-size:.95rem }
  a.btn:hover{ background:#1b6ae8 }
  .err{ color:#ff9d9d }
  code{ display:block; background:#0b1015; border:1px solid #22303d; border-radius:8px;
        padding:12px; font:400 .8rem/1.5 ui-monospace,Menlo,monospace; color:#ff9d9d;
        word-break:break-all; margin-bottom:18px; text-align:left }
</style>
</head>
<body>
  <div class="card">
    <img src="assets/favicon.png" alt="Chifbay"/>
    <h1 id="title">Connecting TikTok…</h1>
    <p id="msg">Finishing the authorization.</p>
    <div id="out"></div>
  </div>

<script>
(function () {
  var API = "https://chifbay-tiktok.chifandcopt.workers.dev";
  var ADMIN = "/tiktok-admin.html";
  var q = new URLSearchParams(location.search);
  var title = document.getElementById("title");
  var msg = document.getElementById("msg");
  var out = document.getElementById("out");

  function back(label) {
    var a = document.createElement("a");
    a.className = "btn"; a.href = ADMIN; a.textContent = label || "Back to posting";
    out.appendChild(a);
  }

  function fail(heading, detail) {
    title.textContent = heading; title.className = "err";
    msg.textContent = "Nothing was connected.";
    if (detail) { var c = document.createElement("code"); c.textContent = detail; out.appendChild(c); }
    back("Try again");
  }

  var err = q.get("error_description") || q.get("error");
  if (err) return fail("TikTok refused the connection", err);

  var code = q.get("code"), state = q.get("state");
  if (!code || !state) return fail("Nothing to connect", "Open this page from the TikTok authorization link, not directly.");

  // The admin key was put here by the posting page before it sent us to TikTok.
  var key = sessionStorage.getItem("cb-tt-key");
  if (!key) return fail("Session expired", "Start again from the posting page so the admin key is available.");

  fetch(API + "/exchange", {
    method: "POST",
    headers: { "Content-Type": "application/json", "X-Admin-Key": key },
    body: JSON.stringify({ code: code, state: state })
  })
    .then(function (r) { return r.json().then(function (j) { if (!r.ok || j.error) throw new Error(j.error || ("HTTP " + r.status)); return j; }); })
    .then(function () {
      title.textContent = "TikTok connected";
      msg.textContent = "Chifbay can now post to your TikTok account.";
      // Clean the one-time code out of the address bar before moving on.
      history.replaceState({}, "", location.pathname);
      back("Continue");
      setTimeout(function () { location.href = ADMIN + "?connected=1"; }, 1200);
    })
    .catch(function (e) { fail("Could not finish connecting", e.message); });
})();
</script>
</body>
</html>
